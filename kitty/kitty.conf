# kitty: JetBrains Mono 12, fundo preto puro e paleta forte preto/vermelho

# ---------- fonte ----------
font_family      JetBrains Mono
font_size        12.0

# ---------- cores: paleta forte, tema Akatsuki (preto e vermelho) ----------
background            #000000
foreground            #e8e8e8
cursor                #ff1a1a
cursor_text_color     #000000
selection_background  #8b0000
selection_foreground  #ffffff
url_color             #00b7ff

# normal
color0   #1c1c1c
color1   #e60000
color2   #00cc00
color3   #ffcc00
color4   #0066ff
color5   #cc00cc
color6   #00b7ff
color7   #d0d0d0
# bright
color8   #555555
color9   #ff3030
color10  #33ff33
color11  #ffee00
color12  #3d8bff
color13  #ff33ff
color14  #33e0ff
color15  #ffffff

# abas
active_tab_background    #e60000
active_tab_foreground    #ffffff
inactive_tab_background  #1c1c1c
inactive_tab_foreground  #d0d0d0
tab_bar_style            powerline

# ---------- comportamento ----------
window_padding_width     6
enable_audio_bell        no
confirm_os_window_close  0
copy_on_select           no

# ---------- janela ----------
# abre na metade de baixo (regra do KWin no Plasma / abrir.sh no GNOME), mas é uma janela normal:
# arraste as bordas, dê dois cliques na barra de título para maximizar ou use F11 para tela cheia
remember_window_size     no
hide_window_decorations  no

map f11 toggle_fullscreen

# ---------- splits ----------
# divisões livres (lado a lado / embaixo); "stack" mostra só a janela atual (zoom)
enabled_layouts splits,stack
# novo split já na mesma pasta do terminal atual
map ctrl+shift+enter      launch --location=split  --cwd=current
map alt+v                 launch --location=vsplit --cwd=current
map alt+h                 launch --location=hsplit --cwd=current
# andar entre os splits
map alt+left   neighboring_window left
map alt+right  neighboring_window right
map alt+up     neighboring_window up
map alt+down   neighboring_window down
# zoom no split atual (liga/desliga) e girar a divisão
map ctrl+shift+z toggle_layout stack
map ctrl+shift+o layout_action rotate
